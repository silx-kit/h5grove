name: Lint & Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  lint_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ['default', 'py315']
        update: [true, false]

    steps:
      - name: Checkout 🏷️
        uses: actions/checkout@v6

      - name: Setup pixi ⚙️
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: ${{ matrix.environment }}

      - name: Update dependencies 🔄
        if: ${{ matrix.update }}
        run: pixi update

      - name: Ruff format check 🎭
        run: pixi run -e ${{ matrix.environment }} ruff_format

      - name: Ruff check ✅
        run: pixi run -e ${{ matrix.environment }} ruff_check

      - name: mypy 🧐
        run: pixi run -e ${{ matrix.environment }} lint_mypy

      - name: pytest tests 👓
        run: |
          pushd src/tests/
          pixi run -e ${{ matrix.environment }} test
          popd

      - name: pytest benchmark 📈
        run: pixi run -e ${{ matrix.environment }} benchmark

      - name: sphinx build 🐪
        run: pixi run -e ${{ matrix.environment }} docbuild
