name: Lint & Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  lint_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']

    steps:
      - name: Checkout 🏷️
        uses: actions/checkout@v6

      - name: Install Python 🐍
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: 'x64'

      - name: Install dependencies ⚙️
        run: |
          python -m pip install -U pip hatch
          hatch env create

      - name: Log Python environment ✏️
        run: |
          hatch run pip freeze

      - name: Ruff format check 🎭
        run: hatch run ruff_format

      - name: Ruff check ✅
        run: hatch run ruff_check

      - name: mypy 🧐
        run: hatch run lint_mypy

      - name: pytest tests 👓
        run: |
          pushd src/tests/
          hatch run test
          popd

      - name: pytest benchmark 📈
        run: hatch run benchmark

      - name: sphinx build 🐪
        run: hatch run docbuild
